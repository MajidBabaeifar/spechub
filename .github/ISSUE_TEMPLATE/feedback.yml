name: Feedback
description: Tell us what works, what doesn't, or what you'd like to see.
labels: [feedback]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What were you trying to do, and how did it go?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: About
      options:
        - The website
        - The specfork command
        - MCP / using it from an agent
        - The specs in general
        - Something else
  - type: input
    id: page
    attributes:
      label: Page or command (optional)
      placeholder: https://specfork.dev/specfork/scheduling/ or specfork resolve …
